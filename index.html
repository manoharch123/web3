<!DOCTYPE html>
<html>
<head>
    <title>My Awesome Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        /* ===== First Row ===== */
        .top {
            display: flex;
            height: 130px;
        }

        .logo {
            width: 30%;
            background-color: #d9dde2;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #777;
        }

        .header {
            width: 70%;
            background-color: #2f5569;
            color: orange;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #777;
        }

        .header h1 {
            font-size: 40px;
        }

        /* ===== Second Row (Menu) ===== */
        .menu {
            display: flex;
            height: 70px;
            background-color: #b7d1dc;
        }

        .menu div {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #777;
            font-size: 20px;
            font-weight: bold;
        }

        .menu a {
            text-decoration: none;
            color: #2f5569;
        }

        .menu div:hover {
            background-color: #9fc3d0;
        }

        /* ===== Third Row ===== */
        .bottom {
            display: flex;
            height: 450px;
        }

        .services {
            width: 30%;
            background-color: #c8e0d0;
            padding: 20px;
            border: 1px solid #777;
        }

        .services h2 {
            text-align: center;
        }

        .services a {
            text-decoration: none;
            color: #2f5569;
            font-size: 22px;
            display: block;
            margin: 15px 0;
        }

        .services a:hover {
            text-decoration: underline;
        }

        .content {
            width: 70%;
            padding: 30px;
            border: 1px solid #777;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

    </style>
</head>

<body>

    <!-- First Row -->
    <div class="top">
        <div class="logo">
            <h2>LOGO</h2>
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg"
                 width="70" height="70" alt="Logo">
        </div>

        <div class="header">
            <h1>My Awesome Website</h1>
        </div>
    </div>

    <!-- Second Row -->
    <div class="menu">
        <div><a href="home.html" target="frame">Home</a></div>
        <div><a href="login.html" target="frame">Login</a></div>
        <div><a href="registration.html" target="frame">Registration</a></div>
        <div><a href="catalogue.html" target="frame">Catalogue</a></div>
        <div><a href="cart.html" target="frame">Cart</a></div>
        <div><a href="contact.html" target="frame">Contact Us</a></div>
    </div>

    <!-- Third Row -->
    <div class="bottom">

        <!-- Services -->
        <div class="services">
            <h2>Services</h2>
            <a href="webdesign.html" target="frame">Web Design</a>
            <a href="hosting.html" target="frame">Hosting</a>
            <a href="support.html" target="frame">Support</a>
        </div>

        <!-- Content Area -->
        <div class="content">
            <iframe name="frame" src="welcome.html"></iframe>
        </div>

    </div>

</body>
</html>
